# The CI toolchain here is pinned to exact versions, deliberately: a tool
# release must never turn CI red on an unchanged commit. The cost of that
# choice is that pins go stale silently, and a stale pin is how a fixed CVE
# stays exploitable. Dependabot pays that cost back — it is the counterpart to
# audit.yml, which detects the problem but cannot fix it.
# The Postgres service images live as one-line digest-pinned Dockerfiles under
# .github/postgres/<major>/ — each full-version tag there resolves to the same
# Docker Hub multi-arch index digest `docker buildx imagetools inspect` shows
# for postgres:<major> — and the docker entry below is their update route: a
# weekly pull request moves the tag and digest within the major, or the digest
# alone when the tag is rebuilt.

version: 2
updates:
  # requirements-dev.txt (lint), requirements-test.txt (coverage) and
  # requirements-diff-cover.txt (diff-cover) are pinned; requirements.txt
  # is unpinned, so Dependabot leaves it alone.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # The eslint toolchain. Nothing here is served to a browser — see
  # package.json — so a bump can only ever affect the lint gate.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is simply frozen
  # forever. It rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      # Group every action bump into one pull request. github/codeql-action's
      # init and analyze steps are separate dependencies that must stay on one
      # version: seven separate bump pairs were opened before this group, and
      # the split bumps (#39 init-only, #40 analyze-only) each left the
      # analyze checks failing.
      version-updates:
        patterns:
          - "*"
      # A group without applies-to covers version updates only (GitHub
      # Dependabot docs), so security updates need their own group.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # The CI service images. Like the actions above, a digest pin never moves on
  # its own — and these Dockerfiles are the only place the digest is written,
  # so the bump lands where CI reads it. The major-ignore keeps the same
  # reviewed-upgrade flow as every other pin here.
  - package-ecosystem: docker
    directories:
      - "/.github/postgres/16"
      - "/.github/postgres/17"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    ignore:
      - dependency-name: postgres
        versions:
          - "version-update:semver-major"

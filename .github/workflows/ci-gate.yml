name: ci gate

# One workflow owns the required context: rulesets require one context per
# name. The paths-ignore gates disappeared on docs-only pushes, leaving no
# check that could be required on every commit.
#
# This file owns every push and pull request. Callees keep workflow_call,
# their crons and workflow_dispatch; they carry no push or pull_request trigger.
#
# The fold fails closed on failed, cancelled, skipped or missing results and
# reports every offending leg. Its one narrowing is base-freshness: that job
# is PR-only by design, so its skipped result is accepted only when the event
# is not a pull_request; an unset event refuses.

on:
  pull_request:
  # Unfiltered on purpose: issue #65 requires the conflict-marker check to
  # run on every push to every branch, and an unfiltered push trigger is
  # what makes that possible.
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: $/.github/workflows/tests.yml

  lint:
    uses: $/.github/workflows/lint.yml

  types:
    uses: $/.github/workflows/types.yml

  eslint:
    uses: $/.github/workflows/eslint.yml

  audit:
    uses: $/.github/workflows/audit.yml

  actionlint:
    uses: $/.github/workflows/actionlint.yml

  codeql:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: $/.github/workflows/codeql.yml

  secrets:
    uses: $/.github/workflows/secrets.yml

  speed:
    uses: $/.github/workflows/speed.yml

  size-baseline:
    uses: $/.github/workflows/size-baseline.yml

  conflict-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check no tracked file carries a merge-conflict marker
        # A marker in Markdown can look like prose to the other gates, so
        # check every tracked file even on docs-only pushes.
        run: |
          # git grep exits 1 for "no match" and above 1 for an error it could
          # not run, and a guard that reads its own error as a clean tree is
          # the false green this step exists to prevent.
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

  base-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head itself, not the synthetic merge: the merge already
          # contains base changes, so a head missing a gate-input commit
          # would pass there. Full depth keeps the head's ancestry local.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check the PR contains the target branch's gate definitions
        run: python3 scripts/ci/gate_base_freshness.py --head ${{ github.event.pull_request.head.sha }}

  aggregate:
    needs: [tests, lint, types, eslint, audit, actionlint, codeql, secrets,
            speed, size-baseline, conflict-markers, base-freshness]
    if: ${{ always() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fold the leg results into one verdict
        env:
          DOCS_HUB_LEG_TESTS: ${{ needs.tests.result }}
          DOCS_HUB_LEG_LINT: ${{ needs.lint.result }}
          DOCS_HUB_LEG_TYPES: ${{ needs.types.result }}
          DOCS_HUB_LEG_ESLINT: ${{ needs.eslint.result }}
          DOCS_HUB_LEG_AUDIT: ${{ needs.audit.result }}
          DOCS_HUB_LEG_ACTIONLINT: ${{ needs.actionlint.result }}
          DOCS_HUB_LEG_CODEQL: ${{ needs.codeql.result }}
          DOCS_HUB_LEG_SECRETS: ${{ needs.secrets.result }}
          DOCS_HUB_LEG_SPEED: ${{ needs.speed.result }}
          DOCS_HUB_LEG_SIZE_BASELINE: ${{ needs.size-baseline.result }}
          DOCS_HUB_LEG_CONFLICT_MARKERS: ${{ needs.conflict-markers.result }}
          DOCS_HUB_LEG_BASE_FRESHNESS: ${{ needs.base-freshness.result }}
          DOCS_HUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          failed=0
          check() {
            if [ "$2" = success ]; then
              return
            fi
            if [ "$1" = base-freshness ] && [ "$2" = skipped ] \
                && [ -n "${DOCS_HUB_EVENT_NAME:-${EVENT_NAME}}" ] \
                && [ "${DOCS_HUB_EVENT_NAME:-${EVENT_NAME}}" != pull_request ]; then
              return
            fi
            echo "$1: ${2:-missing}"
            failed=1
          }

          check tests "${DOCS_HUB_LEG_TESTS:-${LEG_TESTS}}"
          check lint "${DOCS_HUB_LEG_LINT:-${LEG_LINT}}"
          check types "${DOCS_HUB_LEG_TYPES:-${LEG_TYPES}}"
          check eslint "${DOCS_HUB_LEG_ESLINT:-${LEG_ESLINT}}"
          check audit "${DOCS_HUB_LEG_AUDIT:-${LEG_AUDIT}}"
          check actionlint "${DOCS_HUB_LEG_ACTIONLINT:-${LEG_ACTIONLINT}}"
          check codeql "${DOCS_HUB_LEG_CODEQL:-${LEG_CODEQL}}"
          check secrets "${DOCS_HUB_LEG_SECRETS:-${LEG_SECRETS}}"
          check speed "${DOCS_HUB_LEG_SPEED:-${LEG_SPEED}}"
          check size-baseline "${DOCS_HUB_LEG_SIZE_BASELINE:-${LEG_SIZE_BASELINE}}"
          check conflict-markers "${DOCS_HUB_LEG_CONFLICT_MARKERS:-${LEG_CONFLICT_MARKERS}}"
          check base-freshness "${DOCS_HUB_LEG_BASE_FRESHNESS:-${LEG_BASE_FRESHNESS}}"
          exit "$failed"

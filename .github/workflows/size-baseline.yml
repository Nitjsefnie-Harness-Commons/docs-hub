name: size-baseline

# require-tight keeps the records tight; a records change lands as an ordinary commit.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: size-baseline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tracked files against the ratchet
        uses: Nitjsefnie-Actions/size-ratchet@0c9790acfe6bec19f1310a6e17428332185ea3ec # v1.1.0
        with:
          mode: check
          base-ref: ${{ github.event.pull_request.base.sha || github.sha }}
          require-tight: 'true'

name: size-baseline

# The tracked-file line-count ratchet as a ci gate leg. The check runs on
# every event the gate forwards; tighten, stage and upload run only after a
# green check on a push to master, and the push workflow (ratchet-push.yml)
# owns the commit their artifact feeds.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: size-baseline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tracked files against the ratchet
        id: check
        uses: Nitjsefnie-Actions/size-ratchet@67bb01e536611398a3b5cedd3f3cf95fd6e5693e # v1.0.1
        with:
          mode: check
          base-ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Tighten the records after a green check
        if: ${{ !cancelled() && steps.check.conclusion == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: Nitjsefnie-Actions/size-ratchet@67bb01e536611398a3b5cedd3f3cf95fd6e5693e # v1.0.1
        with:
          mode: tighten

      - name: Stage a records change for the push workflow
        if: ${{ !cancelled() && steps.check.conclusion == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        id: stage
        env:
          DOCS_HUB_BASE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$DOCS_HUB_BASE_SHA" ]; then
            echo 'Checkout does not match the measured run head' >&2
            exit 1
          fi
          changed=0
          git diff --quiet -- .github/size-baseline.json || changed=$?
          if [ "$changed" -gt 1 ]; then
            echo "git diff failed with $changed" >&2
            exit "$changed"
          fi
          if [ "$changed" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/size-baseline-push"
          cp .github/size-baseline.json "$RUNNER_TEMP/size-baseline-push/size-baseline.json"
          printf '%s\n' "$DOCS_HUB_BASE_SHA" > "$RUNNER_TEMP/size-baseline-push/base.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Upload a staged records change
        if: ${{ !cancelled() && steps.check.conclusion == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.stage.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-baseline-ratchet
          path: ${{ runner.temp }}/size-baseline-push
          if-no-files-found: error
          retention-days: 1

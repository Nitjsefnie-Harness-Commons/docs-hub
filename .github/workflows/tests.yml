name: tests

# The suite is not unit-testable in isolation: conftest.py drops and recreates
# a real `docs_test` database from backend/schema.sql, then runs every test
# against it. So CI needs a Postgres, and the matrix is over POSTGRES versions
# rather than platforms — this service only ever runs on Linux behind nginx,
# but it is developed against whatever Postgres the box happens to have, and
# the deployed one (17) is not the only one it should work on.
#
# tests/test_cli.py runs everywhere now: the agent-facing CLI lives in this
# repository as docs_hub_cli/ and is driven as `python -m docs_hub_cli.cli`,
# so there is nothing left for a runner to be missing.

on:
  workflow_call:
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit block it
# inherits the repository default, which can be read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # Single source of the Postgres service images: the one-line Dockerfiles
    # under .github/postgres/<major>/, updated by Dependabot's docker
    # ecosystem. The run step names both paths literally so
    # gate_base_freshness.py watches them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image16: ${{ steps.pins.outputs.image16 }}
      image17: ${{ steps.pins.outputs.image17 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pins
        name: Read the Postgres image pins
        run: |
          image16="$(sed -n 's/\r$//; s/^FROM //p' .github/postgres/16/Dockerfile)"
          image17="$(sed -n 's/\r$//; s/^FROM //p' .github/postgres/17/Dockerfile)"
          case "$image16" in postgres:16.*@sha256:*) ;;
            *) echo ".github/postgres/16/Dockerfile does not pin a postgres 16 image: $image16" >&2; exit 1 ;;
          esac
          case "$image17" in postgres:17.*@sha256:*) ;;
            *) echo ".github/postgres/17/Dockerfile does not pin a postgres 17 image: $image17" >&2; exit 1 ;;
          esac
          {
            echo "image16=$image16"
            echo "image17=$image17"
          } >> "$GITHUB_OUTPUT"

  suites:
    needs: images
    name: suites (${{ matrix.python }}, ${{ matrix.postgres }})
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the floor CONTRIBUTING.md states and what the deployment
        # runs. Each explicit entry pairs that Python with a Postgres major;
        # the majors are quoted so the service image ternary compares strings.
        # The image is not stated here: the images job reads it from the
        # digest-pinned Dockerfiles under .github/postgres/<major>/, which
        # Dependabot's docker ecosystem updates weekly.
        include:
          - postgres: "16"
            python: "3.13"
          - postgres: "17"
            python: "3.13"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: ${{ matrix.postgres == '16' && needs.images.outputs.image16 || needs.images.outputs.image17 }} # zizmor: ignore[unpinned-images] — resolved at runtime from the digest-pinned Dockerfiles this workflow's images job reads
        env:
          POSTGRES_PASSWORD: postgres
        # Without the health check the first psql can land before the server
        # finishes its own initdb restart, which fails as a connection refused
        # rather than as anything to do with the tests.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # conftest.py connects with `postgresql:///docs_test` and shells out to
      # dropdb/createdb/psql. Both routes are libpq, so these four variables
      # are all it takes to point the whole suite at the service container —
      # no code in the repo needs a CI-only branch.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in .git/config lets
          # any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the Postgres client
        # The suite calls dropdb/createdb/psql directly. The runner image does
        # ship a client, but which major version is an image detail that has
        # changed before — installing it makes the dependency explicit.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # An intermittent shutdown segfault leaves no stack without this (issue 75).
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest -v -ra

  coverage:
    # A JOB of its own rather than steps in the matrix: coverage of the same
    # code against two Postgres majors reports the same number twice. One run,
    # on the version the deployment actually uses.
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same digest-pinned Dockerfile as the matrix's 17 leg, updated by
        # Dependabot's docker ecosystem.
        image: ${{ needs.images.outputs.image17 }} # zizmor: ignore[unpinned-images] — resolved at runtime from the digest-pinned Dockerfile this workflow's images job reads
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default depth-1 clone gives the changed-lines report no merge
          # base between origin/master and this head, so diff-cover's
          # three-dot diff dies before it can compare anything.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install the Postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install dependencies and the coverage toolchain
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Measure
        id: measure
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONFAULTHANDLER: "1"
        # A FAILING test does not fail this step: the suites job above owns
        # that verdict, and a failing test still executed the lines it reached.
        # What must fail is pytest not running at all — a collection error or
        # an unreachable database would otherwise be reported as a coverage
        # number for a program that never ran. Exit code 5 (no tests
        # collected) and anything above 2 is that case; 1 is "tests failed".
        run: |
          set +e
          python -m coverage run --source=backend,docs_hub_cli -m pytest -q -ra
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "pytest exited $rc (not a test failure) — refusing to report" >&2
            echo "a coverage number for a run that did not happen." >&2
            exit "$rc"
          fi

      - name: Coverage summary
        # Renders whether or not the gate below passes: a coverage regression
        # is only actionable if you can see WHICH file lost lines, and
        # re-reading a scrolled CI log to find that is exactly the friction
        # that gets a gate disabled.
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        run: |
          {
            echo '### Coverage'
            echo
            python -m coverage report --format=markdown --precision=1
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml

      - name: Upload coverage.xml
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Coverage of changed lines (informational)
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' && github.event_name == 'pull_request' }}
        # Information only: the report goes to the job summary, with no
        # --fail-under. A broken tool run shows this step as failed, but
        # continue-on-error stops that failing the job, and so aggregate.
        continue-on-error: true
        run: |
          git fetch --no-tags origin master
          pip install --require-hashes -r requirements-diff-cover.txt
          {
            echo '### Coverage of changed lines (informational)'
            echo
            diff-cover coverage.xml --compare-branch=origin/master
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the coverage raise artifact
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        # The push workflow (ratchet-push.yml) consumes this artifact: the
        # 1-dp overall line coverage and the commit it was measured at.
        run: |
          mkdir coverage-raise
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path("coverage-raise")
          rate = ET.parse("coverage.xml").getroot().attrib["line-rate"]
          (out / "measured.txt").write_text(f"{100 * float(rate):.1f}\n", encoding="utf-8")
          (out / "base.txt").write_text(os.environ["GITHUB_SHA"] + "\n", encoding="utf-8")
          PY

      - name: Upload the coverage raise artifact
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-raise
          path: coverage-raise
          if-no-files-found: error

      - name: Coverage gate
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        # A RATCHET, not a target. The floor is read from the recorded file
        # (.github/ci-thresholds.json) through scripts/ci/thresholds.py, and
        # the automated ratchet (ratchet-push.yml) raises it on green master
        # pushes. Never lower it to make a red build green, and never widen
        # the source list to let new code in under a floor it did not earn:
        # docs_hub_cli reaches 98.4% on its own before it was added here.
        # An assignment's exit status is its command substitution's, so a
        # corrupt thresholds file fails the step instead of gating on "".
        run: |
          floor="$(python3 scripts/ci/thresholds.py --coverage-floor python)"
          python -m coverage report --fail-under="$floor" --precision=1

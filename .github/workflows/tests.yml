name: tests

# conftest.py drops and recreates a real `docs_test` database from
# backend/schema.sql and runs every test not marked `portable` against it. So
# the suites job needs a Postgres, and its matrix is over POSTGRES versions
# rather than platforms: the service only runs on Linux behind nginx, and the
# deployed Postgres (17) is not the only one it should work on. The portable
# job runs the client's database-free tests on Windows, macOS and Linux.
#
# Both run through Nitjsefnie-Actions/test-ratchet: `plan` splits the files
# into shards, `run` runs one shard with coverage measured and uploads it, and
# the `report` job in ci-gate.yml merges the 17 cell's shards, gates its floor
# in .github/ci-thresholds.json, comments on the pull request and, on a master
# push, commits the raised records.
#
# tests/test_cli.py runs wherever the whole suite does: the agent-facing CLI
# lives in this repository as docs_hub_cli/ and is driven as
# `python -m docs_hub_cli.cli`, so there is nothing left for a runner to be
# missing.

on:
  workflow_call:
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit block it
# inherits the repository default, which can be read/write for the whole token.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # Single source of the Postgres service images: the one-line Dockerfiles
    # under docker/postgres/<major>/, updated by Dependabot's docker
    # ecosystem. The run step names both paths literally so
    # gate_base_freshness.py watches them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image16: ${{ steps.pins.outputs.image16 }}
      image17: ${{ steps.pins.outputs.image17 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pins
        name: Read the Postgres image pins
        run: |
          image16="$(sed -n 's/\r$//; s/^FROM //p' docker/postgres/16/Dockerfile)"
          image17="$(sed -n 's/\r$//; s/^FROM //p' docker/postgres/17/Dockerfile)"
          case "$image16" in postgres:16.*@sha256:*) ;;
            *) echo "docker/postgres/16/Dockerfile does not pin a postgres 16 image: $image16" >&2; exit 1 ;;
          esac
          case "$image17" in postgres:17.*@sha256:*) ;;
            *) echo "docker/postgres/17/Dockerfile does not pin a postgres 17 image: $image17" >&2; exit 1 ;;
          esac
          {
            echo "image16=$image16"
            echo "image17=$image17"
          } >> "$GITHUB_OUTPUT"

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: Nitjsefnie-Actions/test-ratchet/plan@e634ce93cb78681f996296c970a486d3c6656f19 # v2.3.0
        with:
          tests: tests/**/test_*.py
          times: .github/test-times.json
          shards: 2

  suites:
    needs: [images, plan]
    name: suites (${{ matrix.python }}, ${{ matrix.postgres }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # 3.15 is the floor CONTRIBUTING.md states and what the deployment
        # runs, and the majors are quoted so the service image ternary
        # compares strings. The image is not stated here: the images job
        # reads it from the digest-pinned Dockerfiles under
        # docker/postgres/<major>/, which Dependabot's docker ecosystem
        # updates weekly.
        python: ["3.15"]
        postgres: ["16", "17"]
        shard: ${{ fromJSON(needs.plan.outputs.matrix).shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: ${{ matrix.postgres == '16' && needs.images.outputs.image16 || needs.images.outputs.image17 }} # zizmor: ignore[unpinned-images] — resolved at runtime from the digest-pinned Dockerfiles this workflow's images job reads
        env:
          POSTGRES_PASSWORD: postgres
        # Without the health check the first psql can land before the server
        # finishes its own initdb restart, which fails as a connection refused
        # rather than as anything to do with the tests.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # conftest.py connects with `postgresql:///docs_test` and shells out to
      # dropdb/createdb/psql. Both routes are libpq, so these four variables
      # are all it takes to point the whole suite at the service container —
      # no code in the repo needs a CI-only branch.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in .git/config lets
          # any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the Postgres client
        id: apt
        # The suite calls dropdb/createdb/psql directly. The runner image ships
        # a client, but which major version it carries is an image detail that
        # can change, so installing it makes the dependency explicit.
        timeout-minutes: 5
        run: |
          EVIDENCE="$RUNNER_TEMP/apt-evidence"
          echo "evidence=$EVIDENCE" >> "$GITHUB_OUTPUT"
          sudo python3 scripts/ci/bounded_apt.py --budget 90 --evidence "$EVIDENCE/update" -- apt-get update --error-on=any -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo python3 scripts/ci/bounded_apt.py --budget 180 --evidence "$EVIDENCE/install" -- apt-get install -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -y --no-install-recommends postgresql-client
          psql --version

      - name: Upload apt evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-evidence-suites-${{ matrix.python }}-${{ matrix.postgres }}-${{ strategy.job-index }}
          path: ${{ steps.apt.outputs.evidence }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # An intermittent shutdown segfault leaves no stack without this.
          PYTHONFAULTHANDLER: "1"
        uses: Nitjsefnie-Actions/test-ratchet/run@e634ce93cb78681f996296c970a486d3c6656f19 # v2.3.0
        with:
          runner: pytest
          tests: tests/**/test_*.py
          times: .github/test-times.json
          # The postgres major is in the cell: the two legs are distinct cells.
          cell: ubuntu-latest-py${{ matrix.python }}-pg${{ matrix.postgres }}
          shard: ${{ matrix.shard }}
          source: backend,docs_hub_cli
          # One worker: conftest.py's session fixture recreates the one
          # shared docs_test database, which parallel workers would race.
          args: -n 0 -v -ra

  portable:
    name: portable (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15, not macos-latest: actions/runner#4833.
        os: [ubuntu-latest, windows-latest, macos-15]
        # 3.14 is the client wheel's requires-python floor.
        python: ["3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the portable tests
        # Unsharded: no test selected exits 5, so an emptied marker fails the job.
        uses: Nitjsefnie-Actions/test-ratchet/run@e634ce93cb78681f996296c970a486d3c6656f19 # v2.3.0
        with:
          runner: pytest
          tests: tests/**/test_*.py
          times: .github/test-times.json
          cell: ${{ matrix.os }}-py${{ matrix.python }}-portable
          source: backend,docs_hub_cli
          args: -n 0 -m portable -v -ra

  app-js:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install the test toolchain
        run: |
          test -f package.json && test -f package-lock.json
          npm ci

      - name: Run the app.js test
        uses: Nitjsefnie-Actions/test-ratchet/run@e634ce93cb78681f996296c970a486d3c6656f19 # v2.3.0
        with:
          runner: node
          tests: tests/app_js.test.mjs
          times: .github/test-times.json
          # The gated cell, so report gates app.js beside the Python suite.
          cell: ubuntu-latest-py3.15-pg17
          name: ubuntu-latest-py3.15-pg17-app-js
          javascript: public/app.js

name: secrets

# Scan the tree and full git history: deleting a credential from the latest
# tree leaves it readable in earlier commits. The daily run also covers
# commits that landed before the gate existed or skipped CI, and a scanner
# bump rechecks that history under the updated rules.
#
# Nitjsefnie-Actions/secret-scan runs the scan. It reads .gitleaks.toml and
# .gitleaksignore from the commit the change is judged against (a pull
# request's base, a push's previous tip, otherwise the default branch's tip),
# so a change cannot exempt its own finding. Keep the config committed so any
# suppression is reviewed alongside the code.

on:
  workflow_call:
  schedule:
    # 03:29 UTC daily. Off the hour deliberately: the top of the hour is when
    # every cron on GitHub fires at once and jobs queue.
    - cron: '29 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan full history: a shallow clone would leave earlier commits
          # outside the gate's coverage.
          fetch-depth: 0
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - uses: Nitjsefnie-Actions/secret-scan@74f89d79a41106c9a65c23f20895b23240665f26 # v1.0.0

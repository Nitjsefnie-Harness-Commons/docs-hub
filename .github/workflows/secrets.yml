name: secrets

# Scan the tree and full git history: deleting a credential from the latest
# tree leaves it readable in earlier commits. The daily run also covers
# commits that landed before the gate existed or skipped CI, and a scanner
# bump rechecks that history under the updated rules.
#
# Redact every finding because CI logs must not repeat the credential the
# gate caught. Keep the config committed so any suppression is reviewed
# alongside the code; extend the default rules rather than replacing them.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # 03:29 UTC daily. Off the hour deliberately: the top of the hour is when
    # every cron on GitHub fires at once and jobs queue.
    - cron: '29 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOCS_HUB_GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's own
      # checksums file. Bump both together.
      DOCS_HUB_GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan full history: a shallow clone would leave earlier commits
          # outside the gate's coverage.
          fetch-depth: 0
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - name: Install gitleaks
        # Verify the downloaded binary before running it; a remote install
        # script would trust whatever that URL serves at run time. Bound the
        # connection so a hung download fails before the job timeout.
        run: |
          tarball="gitleaks_${DOCS_HUB_GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${DOCS_HUB_GITLEAKS_VERSION}/${tarball}"
          echo "${DOCS_HUB_GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan the git history
        id: git_scan
        run: ./gitleaks git --no-banner --redact=100 .

      - name: Scan the working tree
        # Report tree findings even when the history scan is red.
        if: ${{ !cancelled() }}
        run: ./gitleaks dir --no-banner --redact=100 .

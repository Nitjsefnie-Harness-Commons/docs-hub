name: secrets

# Scan the tree and full git history: deleting a credential from the latest
# tree leaves it readable in earlier commits. The daily run also covers
# commits that landed before the gate existed or skipped CI, and a scanner
# bump rechecks that history under the updated rules.
#
# Redact every finding because CI logs must not repeat the credential the
# gate caught. Keep the config committed so any suppression is reviewed
# alongside the code; extend the default rules rather than replacing them.
# The scan reads that config from the trusted commit, never from the change
# being judged, so a change cannot exempt its own finding.

on:
  workflow_call:
  schedule:
    # 03:29 UTC daily. Off the hour deliberately: the top of the hour is when
    # every cron on GitHub fires at once and jobs queue.
    - cron: '29 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DOCS_HUB_GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's own
      # checksums file. Bump both together.
      DOCS_HUB_GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan full history: a shallow clone would leave earlier commits
          # outside the gate's coverage.
          fetch-depth: 0
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - name: Install gitleaks
        # Verify the downloaded binary before running it; a remote install
        # script would trust whatever that URL serves at run time. Bound the
        # connection so a hung download fails before the job timeout.
        run: |
          tarball="gitleaks_${DOCS_HUB_GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${DOCS_HUB_GITLEAKS_VERSION}/${tarball}"
          echo "${DOCS_HUB_GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Take the scan's config and ignore list from the trusted commit
        id: trusted
        # Read from the judged tree, they would let a change exempt its own
        # finding. Trusted: a pull request's base, a push's previous commit,
        # else master's tip (inside ci-gate's call these are its event's).
        env:
          DOCS_HUB_EVENT_NAME: ${{ github.event_name }}
          DOCS_HUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_HUB_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$DOCS_HUB_EVENT_NAME" in
            pull_request) trusted="$DOCS_HUB_BASE_SHA" ;;
            push) trusted="$DOCS_HUB_BEFORE_SHA" ;;
            *) trusted="$(git rev-parse --verify --quiet refs/remotes/origin/master)" || trusted= ;;
          esac
          # An empty name would read the index, the judged tree.
          read_trusted() {
            case "$trusted" in '' | *[!0-9a-f]*) return 1 ;; esac
            git cat-file blob "$trusted:$1"
          }
          dir="$RUNNER_TEMP/gitleaks-trusted"
          mkdir "$dir"
          if ! read_trusted .gitleaks.toml > "$dir/.gitleaks.toml"; then
            echo "no .gitleaks.toml at trusted commit '$trusted': default rules"
            printf '[extend]\nuseDefault = true\n' > "$dir/.gitleaks.toml"
          fi
          if ! read_trusted .gitleaksignore > "$dir/.gitleaksignore"; then
            echo "no .gitleaksignore at trusted commit '$trusted': nothing ignored"
          fi
          python3 -I - "$dir/.gitleaks.toml" <<'PY'
          import sys
          import tomllib

          def keys(table, prefix=""):
              for key, value in table.items():
                  name = prefix + key.lower()
                  yield name, value
                  if isinstance(value, dict):
                      yield from keys(value, name + ".")

          with open(sys.argv[1], "rb") as config:
              if any(n == "extend.path" and v != "" for n, v in keys(tomllib.load(config))):
                  sys.exit("trusted .gitleaks.toml sets [extend] path, which gitleaks "
                           "resolves inside the judged checkout: refusing to scan")
          PY
          # The tree's own exemptions: gitleaks reads ./.gitleaksignore beside
          # the trusted one, and skips a diff git calls binary; `* diff` forces
          # a text diff (`* !diff` would leave git's binary guess in charge).
          rm -rf .gitleaksignore
          echo '* diff' > .git/info/attributes

      # The scan is two invocations, one per surface: git scans the full
      # history and dir the working tree. This is the modern command pair,
      # not the detect/protect spelling gitleaks deprecated in v8.19.0
      # (gitleaks README "Commands" section; v8.19.0 release notes).
      # --ignore-gitleaks-allow: an inline allow comment is the tree's own.
      - name: Scan the git history
        id: git_scan
        # The finding block is actionable; --redact keeps it value-free.
        run: |
          ./gitleaks git --no-banner --verbose --redact=100 --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks-trusted/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-trusted" \
            --log-opts='--full-history --all --diff-filter=uxdb --diff-merges=first-parent' .

      - name: Scan the working tree
        # Report tree findings even when the history scan is red, never
        # without the trusted config.
        if: ${{ !cancelled() && steps.trusted.outcome == 'success' }}
        run: |
          ./gitleaks dir --no-banner --verbose --redact=100 --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks-trusted/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-trusted" .

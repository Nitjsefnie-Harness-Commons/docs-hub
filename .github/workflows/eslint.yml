name: eslint

# The SPA in public/ is plain browser JavaScript served byte-for-byte with
# no build step, the invariant CONTRIBUTING.md states and this gate does
# not change; package.json pins only CI tooling; nothing it installs ships.
# The gate also lints the JavaScript tests in tests/.
#
# No build step is also why the gate matters. There is no bundler or
# module system to catch a typo'd identifier, so an undeclared variable or
# a dead assignment reaches the browser as a blank screen.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eslint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install the linter
        # `npm ci`, not `npm install`: it installs the lockfile exactly and
        # fails if package.json and the lock have drifted apart, so the gate
        # cannot quietly run a different eslint than the one that was reviewed.
        # The `test -f` spellings exist so the base-freshness derivation sees
        # package.json and package-lock.json; an implicit `npm ci` read of
        # them would vanish from the derived file set that leg is judged on.
        run: |
          test -f package.json && test -f package-lock.json
          npm ci

      - name: eslint
        run: npx eslint public tests

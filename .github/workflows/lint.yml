name: lint

# Two gates, one job each so a failure says which tool found it.
#
# Style opinions stay narrow: setup.cfg sets max-line-length to the 100 this
# codebase already wraps at and ignores nothing beyond pycodestyle's own
# defaults, and .pylintrc disables only patterns the code uses deliberately —
# each with the reason written next to it. These exist for real defects, not
# formatting preferences.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pycodestyle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in .git/config lets
          # any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: pip install --require-hashes -r requirements-dev.txt

      - name: pycodestyle
        # git ls-files, not a directory walk: it linters exactly what the
        # repository ships, and .gitignore already denies .venv, store/ and
        # node_modules by default.
        run: git ls-files '*.py' | xargs pycodestyle

  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install linters and the runtime dependencies
        # The runtime deps too: without fastapi and psycopg importable, pylint
        # reports 19 import-errors and stops seeing the code behind them.
        run: |
          pip install -r requirements.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: pylint
        run: git ls-files '*.py' | xargs pylint --rcfile=.pylintrc

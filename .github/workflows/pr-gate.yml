# Fork tokens cannot close a PR; aggregate stays the one required check.
name: pr gate
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, reopened, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: write
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  gate:
    if: >-
      github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Nitjsefnie-Actions/pr-gate@6f3222bfc9c61baa3961d49c98dd3c949d0b5079 # v2.3.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          pull-request-author: ${{ github.event.pull_request.user.login }}
          require-commit-attribution: 'true'

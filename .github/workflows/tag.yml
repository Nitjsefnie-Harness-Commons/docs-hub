name: tag

# Creates the tag that release.yml consumes.
#
# release.yml already does the right thing once a `v*` tag exists: it runs the
# suite, builds the wheel, and publishes SHA256SUMS beside it. What it has no
# way to know is WHEN to fire — someone has to remember to push a tag after
# bumping __version__, and a forgotten tag means a version bump that never
# ships, while the fleet bundle keeps installing the previous wheel.
#
# So this composes with it rather than replacing it: it watches the one file
# that carries the version, pushes the tag, and then STARTS release.yml by
# hand. That last part is not belt-and-braces: a `v*` tag pushed with the
# built-in GITHUB_TOKEN does not trigger release.yml at all. GitHub suppresses
# workflow runs from token-authored events so a workflow cannot loop on its
# own pushes, and `workflow_dispatch` is one of the two documented exceptions
# to that rule -- which is why the last step below dispatches rather than
# relying on the push.
#
# Without it the failure is silent and total: the tag lands, the version looks
# shipped, no release is ever cut, and nothing goes red.
#
# release.yml re-runs the suite itself before publishing anything, so the
# publish path keeps its own safety net regardless of what happened here.
#
# It still waits for the other gates first. A tag is the one artefact that
# outlives a mistake — a branch can be force-pushed, but a release someone
# has pulled cannot be unpublished — so tagging a red commit is worth
# preventing even though release.yml would catch a failing suite later. It
# would NOT catch a lint, type or eslint regression, which never reach that job.

on:
  push:
    # This repository's default branch is master, not main.
    branches: [master]
    paths:
      # The narrowest possible allow-list: the file that holds __version__.
      - 'docs_hub_cli/__init__.py'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to tag (default: the branch tip)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress: a superseded test run teaches you nothing and is
  # worth cancelling; a superseded tag run may be midway through creating a
  # tag.
  group: tag
  cancel-in-progress: false

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      # Reading the other workflows' results for this SHA.
      checks: read

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      skip: ${{ steps.version.outputs.skip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          # This job only reads the tree; the writer uses the API.
          persist-credentials: false

      - name: Read and validate the version
        id: version
        env:
          DOCS_HUB_SHA: ${{ inputs.sha || github.sha }}
        # Read from the imported attribute rather than grepped out of the
        # file: pyproject.toml resolves the distribution version from this
        # same attribute, so reading it the same way is the only way to be
        # sure the tag and the wheel agree. docs_hub_cli/__init__.py imports
        # nothing, so no dependency install is needed to read it.
        run: |
          version="$(python3 -c 'import docs_hub_cli; print(docs_hub_cli.__version__)')"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([._a-z0-9-]*)$'; then
            echo "__version__ is not a usable version: '$version'" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=${DOCS_HUB_SHA:-${SHA}}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *".dev"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipped $version because it is a development version."
            echo "Nothing is tagged and release.yml is not dispatched."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Version is $version"

      - name: Refuse to re-tag an existing version
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_HUB_TAG: ${{ steps.version.outputs.tag }}
          DOCS_HUB_REPO: ${{ github.repository }}
        # An existing tag means either a mistaken edit or a rerun after a
        # partial failure. Both want a human, and both are silent if this
        # step is a no-op instead of an error.
        run: |
          if gh api -H "Cache-Control: no-cache" \
               "repos/${DOCS_HUB_REPO:-${REPO}}/git/ref/tags/${DOCS_HUB_TAG:-${TAG}}" >/dev/null 2>&1; then
            echo "Tag ${DOCS_HUB_TAG:-${TAG}} already exists — __version__ was set to a version" >&2
            echo "that has already shipped. Bump it further, or delete that" >&2
            echo "tag and its release if it was cut in error." >&2
            exit 1
          fi
          echo "${DOCS_HUB_TAG:-${TAG}} is free"

      - name: Wait for the other gates on this commit
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_HUB_SHA: ${{ steps.version.outputs.sha }}
          DOCS_HUB_REPO: ${{ github.repository }}
        # Exclude only the exact tag and release-readiness jobs, including
        # earlier attempts on this SHA. Every required gate must exist and succeed.
        run: |
          # Timing overrides are test hooks; production defaults to 45 minutes
          # with 20 seconds between reads.
          TAG_WAIT_DEADLINE_SECONDS="${TAG_WAIT_DEADLINE_SECONDS:-2700}"
          TAG_WAIT_SLEEP_SECONDS="${TAG_WAIT_SLEEP_SECONDS:-20}"
          # The ci gate aggregate is the one check a master push must carry.
          required='aggregate'
          deadline=$(( SECONDS + TAG_WAIT_DEADLINE_SECONDS ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api --paginate \
              -H "Cache-Control: no-cache" \
              "repos/${DOCS_HUB_REPO:-${REPO}}/commits/${DOCS_HUB_SHA:-${SHA}}/check-runs" \
              --jq '.check_runs[] | select(.name != "tag" and .name != "release-readiness")
                    | "\(.status)\t\(.conclusion)\t\(.name)"')"

            verdict="$(echo "$runs" | awk -F'\t' -v required="$required" '
              BEGIN {
                n = split(required, names, "\n")
                for (i = 1; i <= n; i++) needed[names[i]] = 1
              }
              NF {
                seen[$3] = 1
                if ($1 != "completed") pending = 1
                if ($2 == "failure" || $2 == "cancelled" || $2 == "timed_out" ||
                    ($1 == "completed" && $3 in needed && $2 != "success")) bad = 1
              }
              END {
                for (name in needed) if (!(name in seen)) pending = 1
                if (bad) print "refuse"
                else if (pending) print "wait"
                else print "pass"
              }')"
            echo "Reported checks:"
            echo "$runs" | awk '{print "    " $0}'
            if [ "$verdict" = refuse ]; then
              echo "Refusing to tag: a check did not pass." >&2
              exit 1
            fi
            if [ "$verdict" = wait ]; then
              echo "Required checks missing or checks still running, waiting..."
              sleep "$TAG_WAIT_SLEEP_SECONDS"
              continue
            fi
            echo "Every check passed — proceeding."
            exit 0
          done
          echo "Timed out after $TAG_WAIT_DEADLINE_SECONDS seconds waiting for checks on ${DOCS_HUB_SHA:-${SHA}}" >&2
          exit 1

  tag:
    needs: release-readiness
    if: needs.release-readiness.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Creating the tag. release.yml holds its own write permission for the
      # release itself.
      contents: write
      # Dispatching release.yml. See the last step for why the tag push
      # cannot do that on its own.
      actions: write

    steps:
      - name: Create and push the tag
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_HUB_REPO: ${{ github.repository }}
          DOCS_HUB_TAG: ${{ needs.release-readiness.outputs.tag }}
          DOCS_HUB_SHA: ${{ needs.release-readiness.outputs.sha }}
        # An annotated tag, not lightweight: it records who created it and
        # when, which a lightweight tag does not.
        run: |
          if [[ ! "${DOCS_HUB_TAG:-${TAG}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._a-z0-9-]*)$ ]]; then
            echo "Invalid tag: '${DOCS_HUB_TAG:-${TAG}}'" >&2
            exit 1
          fi
          tag_object="$(gh api --method POST "repos/${DOCS_HUB_REPO:-${REPO}}/git/tags" \
            -f tag="${DOCS_HUB_TAG:-${TAG}}" -f message="${DOCS_HUB_TAG:-${TAG}}" -f object="${DOCS_HUB_SHA:-${SHA}}" -f type=commit --jq '.sha')"
          gh api --method POST "repos/${DOCS_HUB_REPO:-${REPO}}/git/refs" \
            -f ref="refs/tags/${DOCS_HUB_TAG:-${TAG}}" -f sha="$tag_object"
          echo "Pushed ${DOCS_HUB_TAG:-${TAG}} at ${DOCS_HUB_SHA:-${SHA}}."
          {
            echo "### Tagged \`${DOCS_HUB_TAG:-${TAG}}\`"
            echo
            echo "Commit \`${DOCS_HUB_SHA:-${SHA}}\`, after every check on it passed."
            echo "\`release.yml\` builds and publishes the wheel from here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_HUB_TAG: ${{ needs.release-readiness.outputs.tag }}
          DOCS_HUB_REPO: ${{ github.repository }}
        # release.yml also triggers on `push: tags: v*`, and that trigger
        # is what fires for a tag a HUMAN pushes. It does not fire for the
        # tag the step above just pushed, because that push was
        # authenticated with GITHUB_TOKEN. Dispatching is the documented
        # way through, and it composes safely with the push trigger:
        # release.yml replaces the assets on a release that already exists
        # rather than failing, so firing twice is not a problem.
        run: |
          gh workflow run release.yml --repo "${DOCS_HUB_REPO:-${REPO}}" --ref "${DOCS_HUB_TAG:-${TAG}}"
          echo "Dispatched release.yml against ${DOCS_HUB_TAG:-${TAG}}."
          {
            echo "\`release.yml\` dispatched against \`${DOCS_HUB_TAG:-${TAG}}\`; it builds"
            echo "and publishes the wheel and its checksums from there."
          } >> "$GITHUB_STEP_SUMMARY"

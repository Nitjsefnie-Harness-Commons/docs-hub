name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup" — the config lives here so it is reviewable in a diff like every
# other gate). Free on this public repository; findings land in the Security
# tab rather than turning the build red, so a new query shipping upstream
# cannot block an unrelated push.
#
# Python, JavaScript and Actions are analysed. The Python side is the auth
# boundary: a password gate, an HMAC session cookie, an API key, and one
# deliberately anonymous route. The JavaScript side is the SPA, which
# interpolates API-returned strings into innerHTML — precisely the shape
# CodeQL's XSS queries exist for. Actions workflows define this repository's
# CI gates, so they are part of the trust surface. Actions queries find
# pull_request_target misuse, untrusted input interpolated through ${{ }}
# into run: scripts, and over-privileged jobs.
#
# The weekly cron is not redundant with push: CodeQL's query packs are updated
# continuously, and a new query only ever runs against code that has changed
# since it shipped. Without the cron, a rule published today would never be
# applied to a file last touched last year.

on:
  workflow_call:
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the top
    # of the hour is when every cron on GitHub fires at once and jobs queue.
    - cron: '47 3 * * 3'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Writing the analysis results is the whole point; everything else stays
      # read-only.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CodeQL must analyse exactly the commit it will file alerts
          # against, which is the event's own SHA — so no `ref:` here.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `security` pack: this service
          # takes untrusted HTML from agents, stores it, and serves it back —
          # one route to anyone — which is what the extra precision-medium
          # queries are good at.
          queries: security-extended
          # store/ holds published third-party documents with inline scripts.
          # Analysing them would report findings against our users' content.
          config: |
            paths-ignore:
              - store
              - node_modules
              - .venv

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

name: audit

# Dependency vulnerability gate, one job per ecosystem.
#
# pip-audit resolves each requirements file to its full transitive tree and
# checks every resolved version against the PyPI advisory database and OSV.
# Resolution is the point rather than reading the pinned lines: fastapi,
# uvicorn and psycopg drag in dependency trees of their own, and that is where
# an advisory lands.
#
# WHY THE CRON IS THE IMPORTANT TRIGGER. Every other gate here answers "did
# this commit break something", so push is the natural trigger. This one
# answers "is a version we froze months ago still safe", and that answer
# changes when a stranger publishes an advisory, with no commit here to hang
# it on. A push-only audit would report clean forever on a quiet branch. The
# push trigger is the lesser half: it catches a bad pin at the moment it is
# introduced, while the diff is on screen.
#
# This gate FAILS the build rather than filing an advisory, which is the same
# stance as lint and types: a red gate a human must look at beats a
# notification that accumulates unread. When a fix genuinely is not available
# yet, add the advisory to --ignore-vuln WITH a comment saying why and what
# would clear it — never silence the whole gate.

on:
  workflow_call:
  schedule:
    # 04:12 UTC daily. Off the hour deliberately: the top of the hour is when
    # every cron on GitHub fires at once and jobs queue.
    - cron: '12 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.event_name separates this workflow's own scheduled and dispatched
  # runs from its legs called by the ci gate: github.ref inside a called
  # workflow is the caller's ref, so both would otherwise share one group and
  # a cron firing mid-push could cancel that push leg.
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency pulls
          # in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-audit.txt

      - name: Install pip-audit
        # The auditor is hash-installed and audited from its own manifest below.
        run: pip install --require-hashes -r requirements-audit.txt

      - name: Audit the Python dependencies
        # One invocation per manifest: --require-hashes mode is per-invocation,
        # and a joint resolution would reconcile across manifests this gate
        # must audit independently. requirements.txt is the deployed runtime;
        # every hashed manifest below is part of the CI supply-chain surface.
        #
        # No --ignore-vuln entries at present. Each one added here must carry
        # a comment naming the advisory, why it is not fixable, and what would
        # let it be removed.
        #
        # THE RETRY IS NARROW ON PURPOSE. pip-audit resolves against PyPI and
        # the advisory database over the network, and a reset connection
        # produces the same exit status as a real finding. A blanket retry
        # would re-run a genuine vulnerability three times before reporting
        # it, and a gate that goes red for reasons unrelated to its subject is
        # one people learn to ignore. So this retries ONLY transport/service
        # failures — connection errors, could-not-connect, SSLError, HTTP 5xx,
        # rate-limited 429 (the sole retried 4xx, checked before ServiceError
        # so other 4xx responses exit immediately) and a ServiceError
        # exception — and reports findings and every other failure immediately
        # and verbatim. The classifier is copied from
        # Nitjsefnie-Actions/pr-gate .github/workflows/audit.yml.
        run: |
          audit_manifest() {
            local manifest="$1"
            for attempt in 1 2 3; do
              if pip-audit \
                   --progress-spinner off \
                   --requirement "$manifest" \
                   > audit.out 2>&1; then
                cat audit.out
                return 0
              fi

              if grep -qiE '4[0-9][0-9] Client Error' audit.out \
                  && ! grep -qiE '429 (Client Error|Too Many Requests)' audit.out; then
                echo "pip-audit failed with a non-retryable 4xx client error in $manifest:" >&2
                cat audit.out >&2
                exit 1
              fi

              if grep -qiE 'connection (aborted|reset|error)|read timed out|temporary failure in name resolution' audit.out \
                  || grep -qiE 'Could not connect to (PyPI|OSV).*vulnerability feed' audit.out \
                  || grep -qiE '(^|[[:space:]])[[:alnum:]_.]*SSLError:' audit.out \
                  || grep -qiE '5[0-9][0-9] Server Error|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|429 (Client Error|Too Many Requests)' audit.out \
                  || grep -qiE '(^|[[:space:]])(pip_audit\._service\.interface\.)?ServiceError:' audit.out; then
                echo "$manifest attempt $attempt: transport/service failure, retrying"
                tail -n 5 audit.out
                sleep $(( attempt * 15 ))
                continue
              fi

              echo "pip-audit reported findings in $manifest:" >&2
              cat audit.out >&2
              exit 1
            done

            echo "pip-audit could not reach PyPI or the vulnerability feed for $manifest after 3 attempts:" >&2
            cat audit.out >&2
            exit 1
          }

          for manifest in requirements.txt requirements-dev.txt requirements-test.txt \
                          requirements-diff-cover.txt requirements-audit.txt \
                          requirements-zizmor.txt requirements-build.txt \
                          requirements-speed.txt; do
            audit_manifest "$manifest"
          done

  npm-audit:
    # The npm surface is CI tooling only (eslint, jsdom); nothing in it
    # is served to a browser. It still runs in CI with a repository token, so
    # it gets the same treatment as the Python toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: npm audit
        # --audit-level=low: the tree is CI tooling only, so there is no
        # volume argument for tolerating known-vulnerable versions here.
        run: npm audit --audit-level=low

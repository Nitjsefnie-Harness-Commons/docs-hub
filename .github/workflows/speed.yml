name: speed

# This commit's workloads are counted under valgrind cachegrind and checked
# against the committed budget: scripts/ci/speed.py says why.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speed-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image17: ${{ steps.pins.outputs.image17 }}
      speed: ${{ steps.pins.outputs.speed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pins
        name: Read the Postgres and speed image pins
        run: |
          image17="$(sed -n 's/\r$//; s/^FROM //p' .github/postgres/17/Dockerfile)"
          case "$image17" in postgres:17.*@sha256:*) ;;
            *) echo ".github/postgres/17/Dockerfile does not pin a postgres 17 image: $image17" >&2; exit 1 ;;
          esac
          speed="$(sed -n 's/\r$//; s/^FROM //p' .github/speed/Dockerfile)"
          case "$speed" in python:3.*@sha256:*) ;;
            *) echo ".github/speed/Dockerfile does not pin a python 3 image: $speed" >&2; exit 1 ;;
          esac
          echo "image17=$image17" >> "$GITHUB_OUTPUT"
          echo "speed=$speed" >> "$GITHUB_OUTPUT"

  # The counts run inside one digest-pinned image, so Python, libc and
  # valgrind come from the commit, not from the runner image.
  speed:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.images.outputs.speed }} # zizmor: ignore[unpinned-images] - resolved at runtime from the digest-pinned Dockerfile this workflow's images job reads
      # Valgrind refuses to start under Docker's near-unlimited fd limit.
      options: --ulimit nofile=65536:65536

    services:
      postgres:
        image: ${{ needs.images.outputs.image17 }} # zizmor: ignore[unpinned-images] - resolved at runtime from the digest-pinned Dockerfile this workflow's images job reads
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      DOCS_HUB_SPEED_IMAGE: ${{ needs.images.outputs.speed }}

    steps:
      # Before the checkout: without git it fetches a tarball with no history.
      # The snapshot is the image's own (its debian.sources names it), so
      # libc6-dbg matches the image's libc6; a new image needs new pins here.
      - name: Install git, the Postgres client and valgrind
        timeout-minutes: 5
        run: |
          cat > /etc/apt/sources.list.d/debian.sources <<'EOF'
          Types: deb
          URIs: https://snapshot.debian.org/archive/debian/20261020T213255Z
          Suites: trixie trixie-updates
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp
          Check-Valid-Until: no

          Types: deb
          URIs: https://snapshot.debian.org/archive/debian-security/20261020T213255Z
          Suites: trixie-security
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.pgp
          Check-Valid-Until: no
          EOF
          apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -y --no-install-recommends git postgresql-client valgrind=1:3.24.0-3 libc6-dbg=2.41-12+deb13u4
          # The runner owns the mounted workspace; later git calls run as root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the virtualenv from the speed lock
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes -r requirements-speed.txt

      - name: Refuse an undeclared budget raise
        run: |
          test -f scripts/ci/budget_chain.py
          python3 scripts/ci/budget_raise.py
        env:
          DOCS_HUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_HUB_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DOCS_HUB_BEFORE_SHA: ${{ github.event.before }}
          DOCS_HUB_EVENT_NAME: ${{ github.event_name }}
          DOCS_HUB_REF_NAME: ${{ github.ref_name }}
          DOCS_HUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Measure this commit's workloads
        id: measure
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/ci/speed.py measure \
            --database docs_speed --out "$RUNNER_TEMP/measurement.json"
          # In a container job runner.temp can expand to the host's path.
          echo "temp=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"

      - name: Ask whether the toolchain left the budget's
        id: mismatch
        run: |
          mismatch="$("$RUNNER_TEMP/venv/bin/python" scripts/ci/speed.py mismatch \
            --measurements "$RUNNER_TEMP/measurement.json" \
            --budget .github/speed-budget.json)"
          case "$mismatch" in
            true|false) echo "mismatch=$mismatch" >> "$GITHUB_OUTPUT" ;;
            *) echo "speed.py mismatch printed '$mismatch', not true or false" >&2; exit 1 ;;
          esac

      # Same job, same Python and valgrind; the base tree's own lock, so a
      # lock bump is part of the head's delta. This checkout's harness drives it.
      # The base pairs with the checkout: a pull request's base tip (the
      # merge commit's), a push's ancestor `before`, else HEAD's first parent.
      - name: Measure the base commit beside this one
        if: steps.mismatch.outputs.mismatch == 'true'
        run: |
          base="$(python3 scripts/ci/speed_base.py)"
          git worktree add --detach "$RUNNER_TEMP/base-tree" "$base"
          python -m venv "$RUNNER_TEMP/base-venv"
          "$RUNNER_TEMP/base-venv/bin/python" -m pip install --require-hashes \
            -r "$RUNNER_TEMP/base-tree/requirements-speed.txt"
          "$RUNNER_TEMP/base-venv/bin/python" scripts/ci/speed.py measure \
            --tree "$RUNNER_TEMP/base-tree" --database docs_speed \
            --out "$RUNNER_TEMP/base-measurement.json" --base-sha "$base"
        env:
          DOCS_HUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_HUB_BEFORE_SHA: ${{ github.event.before }}
          DOCS_HUB_EVENT_NAME: ${{ github.event_name }}

      - name: Check the counts against the committed budget
        run: |
          test -f scripts/ci/speed_budget.py
          test -f scripts/ci/speed_paired.py
          case "$DOCS_HUB_SPEED_MISMATCH" in
            true) set -- --base-measurements "$RUNNER_TEMP/base-measurement.json" ;;
            false) set -- ;;
            *) echo "the mismatch step answered '$DOCS_HUB_SPEED_MISMATCH', not true or false" >&2; exit 1 ;;
          esac
          "$RUNNER_TEMP/venv/bin/python" scripts/ci/speed.py check \
            --measurements "$RUNNER_TEMP/measurement.json" \
            --budget .github/speed-budget.json \
            --summary "$GITHUB_STEP_SUMMARY" "$@"
        env:
          DOCS_HUB_SPEED_MISMATCH: ${{ steps.mismatch.outputs.mismatch }}

      # Both paths share $RUNNER_TEMP, the artifact root: ratchet-push reads
      # measurement.json there; base-measurement.json exists only on a mismatch.
      - name: Upload the measurement
        if: ${{ !cancelled() && steps.measure.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-measurement
          path: |
            ${{ steps.measure.outputs.temp }}/measurement.json
            ${{ steps.measure.outputs.temp }}/base-measurement.json
          if-no-files-found: error

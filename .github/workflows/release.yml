name: release

# Publishes the `docs-hub-cli` wheel a consumer installs. The checksum file is
# not optional decoration: the fleet setup bundle fetches the newest release
# and has no other way to prove it got the artifact this workflow built, so
# SHA256SUMS ships beside the wheel and the installer verifies against it
# before installing.
#
# Only the CLIENT ships. pyproject.toml lists `packages = ["docs_hub_cli"]`
# explicitly, so the server in backend/ — its schema, its session secret
# handling — is not in the wheel even though it lives in the same repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      replace:
        description: 'Replace the assets of a release that already has them'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    # Single source of the Postgres service images: the one-line Dockerfiles
    # under docker/postgres/<major>/, updated by Dependabot's docker
    # ecosystem. The run step names both paths literally so the
    # freshness leg watches them, and the outputs are the only place
    # the jobs below get an image from.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image16: ${{ steps.pins.outputs.image16 }}
      image17: ${{ steps.pins.outputs.image17 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pins
        name: Read the Postgres image pins
        run: |
          image16="$(sed -n 's/\r$//; s/^FROM //p' docker/postgres/16/Dockerfile)"
          image17="$(sed -n 's/\r$//; s/^FROM //p' docker/postgres/17/Dockerfile)"
          case "$image16" in postgres:16.*@sha256:*) ;;
            *) echo "docker/postgres/16/Dockerfile does not pin a postgres 16 image: $image16" >&2; exit 1 ;;
          esac
          case "$image17" in postgres:17.*@sha256:*) ;;
            *) echo "docker/postgres/17/Dockerfile does not pin a postgres 17 image: $image17" >&2; exit 1 ;;
          esac
          {
            echo "image16=$image16"
            echo "image17=$image17"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    # The suite below needs a real database: tests/conftest.py drops and
    # recreates `docs_test` from backend/schema.sql for every test not marked
    # `portable`. Publishing without running it would mean
    # shipping a client whose end-to-end agreement with the server was never
    # checked on this commit, so the release job carries the same Postgres the
    # tests job does, on the version the deployment runs.
    services:
      postgres:
        # The same digest-pinned Dockerfile the tests workflow's 17 leg reads;
        # Dependabot's docker ecosystem updates it weekly.
        image: ${{ needs.images.outputs.image17 }} # zizmor: ignore[unpinned-images] — resolved at runtime from the digest-pinned Dockerfile this workflow's images job reads
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # conftest.py connects with `postgresql:///docs_test` and shells out to
      # dropdb/createdb/psql. Both routes are libpq, so these four variables
      # point the whole suite at the service container.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install the Postgres client
        id: apt
        # The suite calls dropdb/createdb/psql directly. The runner image ships
        # a client, but which major version it carries is an image detail that
        # can change, so installing it makes the dependency explicit.
        timeout-minutes: 5
        run: |
          EVIDENCE="$RUNNER_TEMP/apt-evidence"
          echo "evidence=$EVIDENCE" >> "$GITHUB_OUTPUT"
          sudo python3 scripts/ci/bounded_apt.py --budget 90 --evidence "$EVIDENCE/update" -- apt-get update --error-on=any -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo python3 scripts/ci/bounded_apt.py --budget 180 --evidence "$EVIDENCE/install" -- apt-get install -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -y --no-install-recommends postgresql-client

      - name: Upload apt evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-evidence-release
          path: ${{ steps.apt.outputs.evidence }}

      - name: Install the build backend and the server's dependencies
        # requirements.txt is the SERVER's: the suite boots the FastAPI app on
        # a local port and drives the CLI against it. The client itself
        # declares no dependencies, which is the property the wheel ships.
        run: |
          pip install --require-hashes -r requirements-build.txt
          python -m pip install -r requirements.txt

      - name: Install the package itself
        # For the suite, not for the build: the moment the client gains a
        # runtime dependency, an uninstalled package dies at import — taking
        # the release with it, before anything is built.
        # --no-build-isolation keeps the backend from requirements-build.txt;
        # an isolated install would download an unverified backend.
        run: pip install . --no-build-isolation

      - name: Run the suite before publishing anything
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -ra

      - name: Build the wheel
        # --no-isolation uses the hash-installed backend instead of downloading
        # an unverified build environment.
        run: python -m build --wheel --no-isolation

      - name: Prove the wheel is the client and nothing else
        # `packages = ["docs_hub_cli"]` in pyproject.toml exists to keep the
        # server out of a client wheel. Nothing else checks that: switch it to
        # auto-discovery and the build still succeeds, publishing backend/ --
        # its schema and its credential handling -- to anyone who pip installs
        # the CLI. Assert the property here, where it is about to be shipped.
        run: |
          python3 - <<'EOF'
          import sys, zipfile, glob
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          tops = {n.split("/")[0] for n in names if "/" in n}
          extra = tops - {"docs_hub_cli"} - {n for n in tops
                                             if n.endswith(".dist-info")}
          if extra:
              sys.exit(f"the wheel ships more than the client: {sorted(extra)}")
          print(f"wheel contents: {sorted(tops)}")
          EOF

      - name: Prove the wheel is this tag's version
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
            *)
              echo "Not a tag ref ($GITHUB_REF); nothing to publish." >&2
              echo "Push a v* tag — .github/workflows/tag.yml does that" >&2
              echo "automatically when __version__ changes." >&2
              exit 1
              ;;
          esac

          python3 - "$tag" <<'EOF'
          import glob
          import sys
          import zipfile
          from email import message_from_bytes

          from packaging.version import Version
          from docs_hub_cli import __version__

          tag = sys.argv[1]
          with zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]) as wheel:
              metadata = next(n for n in wheel.namelist()
                              if n.endswith(".dist-info/METADATA"))
              wheel_version = message_from_bytes(wheel.read(metadata)).get("Version")
          agreement = (f"tag {tag}; __version__ {__version__}; "
                       f"wheel Version {wheel_version or '<missing>'}")
          if (wheel_version is None or tag != "v" + __version__
                  or Version(wheel_version) != Version(__version__)):
              sys.exit(f"Version mismatch: {agreement}")
          print(f"Versions agree: {agreement}")
          EOF

      - name: Publish checksums beside the wheel
        working-directory: dist
        # `--` so a wheel whose name starts with a dash cannot be read as
        # an option (shellcheck SC2035).
        run: sha256sum -- *.whl > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      # Both for the provenance attestation: a Sigstore certificate is
      # issued against the job's OIDC token.
      id-token: write
      attestations: write

    steps:
      - name: Refuse a ref that is not a tag
        id: tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Not a tag ref ($GITHUB_REF); nothing to publish." >&2
              echo "Push a v* tag — .github/workflows/tag.yml does that" >&2
              echo "automatically when __version__ changes." >&2
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Verify the downloaded artifact against its checksums
        run: (cd dist && sha256sum -c SHA256SUMS)

      - name: Decide how to publish, or refuse
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOCS_HUB_TAG: ${{ steps.tag.outputs.tag }}
          DOCS_HUB_REPLACE: ${{ inputs.replace }}
        # Every refusal fires here, before the attestation below records a
        # wheel this run would then not publish.
        #
        # A release with assets is refused unless `replace` is set: assets
        # once published are what consumers already verified. A published
        # immutable release takes no new or replaced asset and its tag can
        # never be reused, so it is refused outright. `gh release create`
        # drafts, uploads, then publishes, so an interrupted create leaves a
        # draft, which gets its assets and is then published.
        run: |
          error="$RUNNER_TEMP/release-view.err"
          if ! found="$(gh release view "$DOCS_HUB_TAG" \
              --json isDraft,isImmutable,assets \
              --jq '"\(.isDraft) \(.isImmutable) \(.assets | length)"' 2>"$error")"; then
            if [ "$(cat "$error")" != "release not found" ]; then
              echo "Could not read release $DOCS_HUB_TAG:" >&2
              cat "$error" >&2
              exit 1
            fi
            echo "action=create" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read -r draft immutable assets <<< "$found"
          if [ "$assets" != 0 ] && [ "$DOCS_HUB_REPLACE" != true ]; then
            echo "Release $DOCS_HUB_TAG already has $assets asset(s); not replacing them." >&2
            echo "Dispatch release.yml against $DOCS_HUB_TAG with replace: true to" >&2
            echo "replace them; a published immutable release refuses even that." >&2
            exit 1
          fi
          if [ "$draft" = false ] && [ "$immutable" = true ]; then
            echo "Release $DOCS_HUB_TAG is published and immutable: GitHub takes no new" >&2
            echo "or replaced asset on it, and its tag cannot be reused." >&2
            echo "Release the next version instead." >&2
            exit 1
          fi
          if [ "$assets" = 0 ]; then
            echo "action=upload" >> "$GITHUB_OUTPUT"
          else
            echo "action=clobber" >> "$GITHUB_OUTPUT"
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl

      - name: Attach the wheel and its checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOCS_HUB_TAG: ${{ steps.tag.outputs.tag }}
          DOCS_HUB_ACTION: ${{ steps.plan.outputs.action }}
          DOCS_HUB_DRAFT: ${{ steps.plan.outputs.draft }}
        # `gh`, not a third-party action: it is preinstalled and maintained
        # by GitHub, and this job holds contents: write. The one action
        # here besides the artifact download is GitHub's own attester,
        # pinned to a commit.
        run: |
          case "$DOCS_HUB_ACTION" in
            create)
              gh release create "$DOCS_HUB_TAG" --title "$DOCS_HUB_TAG" --generate-notes \
                dist/*.whl dist/SHA256SUMS ;;
            upload) gh release upload "$DOCS_HUB_TAG" dist/*.whl dist/SHA256SUMS ;;
            clobber)
              echo "Release $DOCS_HUB_TAG has assets; replacing them, as asked."
              gh release upload "$DOCS_HUB_TAG" dist/*.whl dist/SHA256SUMS --clobber ;;
            *)
              echo "No publishing action decided for $DOCS_HUB_TAG ('$DOCS_HUB_ACTION')." >&2
              exit 1 ;;
          esac
          if [ "$DOCS_HUB_DRAFT" = true ]; then
            gh release edit "$DOCS_HUB_TAG" --draft=false
          fi
          echo "Published $DOCS_HUB_TAG."

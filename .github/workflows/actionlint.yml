name: actionlint

# The gate on the gates. Everything else in .github/workflows is unreviewed
# code that runs with a repository token, and a mistake in it fails in ways
# the other gates structurally cannot catch: a workflow with a typo in an
# `if:` expression does not go red, it silently stops running.
#
# Two tools, because they answer different questions:
#
#   actionlint — is this workflow WELL-FORMED? Schema, expression syntax,
#   context availability, `runs-on` labels, and shellcheck over every `run:`
#   block, which is where most real bugs live.
#
#   zizmor — is this workflow SAFE? Script injection through `${{ }}` in a
#   `run:` block, over-broad `permissions:`, credential persistence after
#   checkout, unpinned action references.
#
# Both tools are pinned. actionlint is verified by checksum rather than
# trusted from the release page, because a linter that runs before every
# other gate is a supply-chain position worth defending. The pin is the
# Nitjsefnie-OSC/actionlint fork, not stock rhysd/actionlint: queue.1 adds
# the `concurrency` `queue:` key, queue.2 adds the `$/` self-repository
# `uses:` form, and stock 1.7.12 rejects both, so a `queue: max` (#43's
# claim workflow) would false-red this gate while passing everywhere else. The
# `$/` form is used here: zizmor 1.31's self-repository audit asks for it, and
# ci-gate.yml's callee calls carry it. The `queue:` key is the remaining
# fleet forward-compatibility, and it unblocks #43.
#
# Suppressions belong at the offending line as a `# zizmor: ignore[rule]`
# comment WITH a justification, never as a raised --min-severity here: a
# threshold silences the next finding too, and the next one is the one nobody
# has thought about yet.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOCS_HUB_ACTIONLINT_VERSION: 1.7.12-queue.2
      # sha256 of actionlint_1.7.12-queue.2_linux_amd64.tar.gz, from the release's own
      # checksums file. Bump both together.
      DOCS_HUB_ACTIONLINT_SHA256: 2895b2f0f5b4cff420a4a577d609f83d0d3bef256aeef480961e53be01a5a954

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-zizmor.txt

      - name: Install actionlint
        # Downloaded and checksum-verified rather than piped from the install
        # script: piping a remote script into a shell would make this job
        # trust whatever that URL serves at run time. The timeouts are there
        # so a hung connection fails in seconds instead of burning the job.
        run: |
          tarball="actionlint_${DOCS_HUB_ACTIONLINT_VERSION:-${ACTIONLINT_VERSION}}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "$tarball" \
            "https://github.com/Nitjsefnie-OSC/actionlint/releases/download/v${DOCS_HUB_ACTIONLINT_VERSION:-${ACTIONLINT_VERSION}}/${tarball}"
          echo "${DOCS_HUB_ACTIONLINT_SHA256:-${ACTIONLINT_SHA256}}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        run: pip install --require-hashes -r requirements-zizmor.txt

      - name: actionlint
        id: actionlint
        run: ./actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Runs even when actionlint is red, so one push reports both gates —
        # the same pattern lint.yml uses for pylint/pycodestyle. Not when the
        # install itself failed, which would report a tool bug as a clean
        # audit.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          # Enables the online audits (resolving action refs, checking for
          # known-vulnerable action versions). Read-only, and this workflow
          # declares contents: read.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/
